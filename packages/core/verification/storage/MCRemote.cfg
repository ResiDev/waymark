\* A server that pushes every write to every tab, records heard in order, savePartial applied in a
\* transaction and landing in the order sent. Loads and saves may fail, another device may write a newer
\* version. Every rule here holds.
CONSTANTS
  Adapter = "partial"
  Async = TRUE
  InOrder = TRUE
  TellsOwnWrites = TRUE
  HearCurrent = FALSE
  Failures = TRUE
  Unmounts = FALSE
  MaxClock = 2
  MaxCmds = 3
  MaxDevice = 1
  DeviceValues <- NewerVersion
  InitialStored <- NothingStored
  Commands <- AllCommands
SPECIFICATION Spec
INVARIANTS TypeOK NoSaveWhileLoading NoReadBeforeConnect NoListenAfterUnmount HoldsHeardWhileLoading NeverOverwriteUnreadable SaveKeepsOthersEntries UnreadableReportedOnce QuietTabsAgree MostRecentStored HearsEveryWrite
