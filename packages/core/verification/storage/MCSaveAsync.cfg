\* A save adapter that answers later, such as one over IndexedDB, with a tab told of other tabs'
\* writes by a BroadcastChannel. Loads and saves may fail, another device may write a newer version.
\* Every rule here holds. MostRecentStored is left out: it breaks by the race BrokenSaveKeepsOthersEntries.cfg finds.
CONSTANTS
  Adapter = "whole"
  Async = TRUE
  InOrder = TRUE
  TellsOwnWrites = FALSE
  HearCurrent = TRUE
  Failures = TRUE
  Unmounts = FALSE
  MaxClock = 2
  MaxCmds = 3
  MaxDevice = 1
  DeviceValues <- NewerVersion
  InitialStored <- NothingStored
  Commands <- AllCommands
SPECIFICATION Spec
INVARIANTS TypeOK NoSaveWhileLoading NoReadBeforeConnect NoListenAfterUnmount ListensOnlyOnceLoaded UnreadableReportedOnce QuietTabsAgreeButNewer
