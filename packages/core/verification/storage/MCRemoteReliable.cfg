\* The server of MCRemote.cfg, when no load or save fails, no other device writes and tabs stay connected.
\* Every rule here holds.
CONSTANTS
  Adapter = "partial"
  Async = TRUE
  InOrder = TRUE
  TellsOwnWrites = TRUE
  HearCurrent = FALSE
  Failures = FALSE
  Unmounts = FALSE
  MaxClock = 2
  MaxCmds = 4
  MaxDevice = 0
  DeviceValues <- NoDevice
  InitialStored <- NothingStored
  Commands <- AllCommands
SPECIFICATION Spec
INVARIANTS TypeOK NoSaveWhileLoading NoReadBeforeConnect NoListenAfterUnmount HoldsHeardWhileLoading NeverOverwriteUnreadable SaveKeepsOthersEntries UnreadableReportedOnce MostRecentStored QuietTabsAgree HearsEveryWrite NoReshowHere
