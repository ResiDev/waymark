\* The server of MCRemote.cfg, when no load or save fails, no other device writes and tabs stay connected.
\* Here every tab agrees with storage once quiet. Elsewhere QuietTabsAgree breaks, and QuietTabsAgreeButNewer
\* holds: a tab keeps an entry newer than the stored one, and never saves it again. A failed savePartial, a
\* replace with an older record, or an older save landing after a removal while a tab is disconnected leaves
\* storage older than the tab. Every rule here holds.
CONSTANTS
  Adapter = "partial"
  Async = TRUE
  InOrder = TRUE
  TellsOwnWrites = TRUE
  HearCurrent = FALSE
  Failures = FALSE
  Unmounts = FALSE
  MaxClock = 2
  MaxCmds = 4
  MaxDevice = 0
  DeviceValues <- NoDevice
  InitialStored <- NothingStored
  Commands <- AllCommands
SPECIFICATION Spec
INVARIANTS TypeOK NoSaveWhileLoading NoReadBeforeConnect NoListenAfterUnmount ListensOnlyOnceLoaded NeverOverwriteUnreadable SaveKeepsOthersEntries UnreadableReportedOnce MostRecentStored QuietTabsAgree
