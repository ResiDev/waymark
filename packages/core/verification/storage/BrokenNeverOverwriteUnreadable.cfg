\* Breaks: a newer version lands between a save's load and its store, and the store writes over it.
\* bugs.test.ts: "a save writes over a record a newer Waymark wrote meanwhile".
CONSTANTS
  Adapter = "whole"
  Async = TRUE
  InOrder = TRUE
  TellsOwnWrites = FALSE
  HearCurrent = TRUE
  Failures = FALSE
  Unmounts = FALSE
  MaxClock = 2
  MaxCmds = 4
  MaxDevice = 1
  DeviceValues <- NewerVersion
  InitialStored <- NothingStored
  Commands <- AllCommands
SPECIFICATION Spec
INVARIANTS NeverOverwriteUnreadable
