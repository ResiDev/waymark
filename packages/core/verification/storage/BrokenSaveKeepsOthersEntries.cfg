\* Breaks: two tabs on a save adapter that answers later both load, then both store, and the second
\* writes over the first's entries. docs/design/storage-saves/README.md's open questions name it for two devices.
\* bugs.test.ts: "a tick in one tab is lost when another tab saves at the same time".
CONSTANTS
  Adapter = "whole"
  Async = TRUE
  InOrder = TRUE
  TellsOwnWrites = FALSE
  HearCurrent = TRUE
  Failures = FALSE
  Unmounts = FALSE
  MaxClock = 2
  MaxCmds = 4
  MaxDevice = 0
  DeviceValues <- NoDevice
  InitialStored <- NothingStored
  Commands <- AllCommands
SPECIFICATION Spec
INVARIANTS SaveKeepsOthersEntries
