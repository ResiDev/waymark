\* localStorage: a save adapter that loads and saves within the call, not telling a tab of its own writes,
\* reading what is stored when told. Saves and the load may fail, a tab may disconnect, another device may
\* write a newer version. Every rule here holds.
CONSTANTS
  Adapter = "whole"
  Async = FALSE
  InOrder = TRUE
  TellsOwnWrites = FALSE
  HearCurrent = TRUE
  Failures = TRUE
  Unmounts = TRUE
  MaxClock = 2
  MaxCmds = 4
  MaxDevice = 1
  DeviceValues <- NewerVersion
  InitialStored <- NothingStored
  Commands <- AllCommands
SPECIFICATION Spec
INVARIANTS TypeOK NoSaveWhileLoading NoReadBeforeConnect NoListenAfterUnmount HoldsHeardWhileLoading NeverOverwriteUnreadable SaveKeepsOthersEntries UnreadableReportedOnce QuietTabsAgreeButNewer HearsEveryWrite MostRecentStored
