\* Breaks with localStorage too, but only when a failed save goes again with a later one.
CONSTANTS
  Adapter = "whole"
  Async = FALSE
  InOrder = TRUE
  TellsOwnWrites = FALSE
  HearCurrent = TRUE
  Failures = TRUE
  Unmounts = FALSE
  MaxClock = 2
  MaxCmds = 4
  MaxDevice = 0
  DeviceValues <- NoDevice
  InitialStored <- NothingStored
  Commands <- AllCommands
SPECIFICATION Spec
INVARIANTS MostRecentStored
