\* Breaks: a tab keeps its newer entry over the older one stored, so it disagrees with storage for good.
\* QuietTabsAgreeButNewer holds in every MC*.cfg: this is the only way it breaks.
\* bugs.test.ts: "a tab shows a hint finished while storage holds it running ...".
CONSTANTS
  Adapter = "partial"
  Async = TRUE
  InOrder = TRUE
  TellsOwnWrites = TRUE
  HearCurrent = FALSE
  Failures = FALSE
  Unmounts = FALSE
  MaxClock = 2
  MaxCmds = 4
  MaxDevice = 0
  DeviceValues <- NoDevice
  InitialStored <- NothingStored
  Commands <- AllCommands
SPECIFICATION Spec
INVARIANTS QuietTabsAgree
