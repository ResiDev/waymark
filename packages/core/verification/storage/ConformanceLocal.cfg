\* localStorage: a save adapter that answers at once, with a newer version written and replaced.
\* Walked move by move on the real Runs by conformance.test.ts.
CONSTANTS
  Adapter = "whole"
  Async = FALSE
  InOrder = TRUE
  TellsOwnWrites = FALSE
  HearCurrent = TRUE
  Failures = FALSE
  Unmounts = FALSE
  MaxClock = 1
  MaxCmds = 3
  MaxDevice = 1
  DeviceValues <- NewerVersion
  InitialStored <- NothingStored
  Commands <- AllCommands
SPECIFICATION Spec
INVARIANTS TypeOK
