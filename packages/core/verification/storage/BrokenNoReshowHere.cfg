\* Breaks: a tab hears a record without the hint it just finished, forgets it, and shows it again.
\* bugs.test.ts: "a finished hint shows again ...".
CONSTANTS
  Adapter = "partial"
  Async = TRUE
  InOrder = TRUE
  TellsOwnWrites = TRUE
  HearCurrent = FALSE
  Failures = FALSE
  Unmounts = FALSE
  MaxClock = 2
  MaxCmds = 4
  MaxDevice = 0
  DeviceValues <- NoDevice
  InitialStored <- NothingStored
  Commands <- AllCommands
SPECIFICATION Spec
INVARIANTS NoReshowHere
