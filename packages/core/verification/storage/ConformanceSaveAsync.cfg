\* A save adapter that answers later, such as one over IndexedDB, with loads and saves failing.
\* Walked move by move on the real Runs by conformance.test.ts.
CONSTANTS
  Adapter = "whole"
  Async = TRUE
  InOrder = TRUE
  TellsOwnWrites = FALSE
  HearCurrent = TRUE
  Failures = TRUE
  Unmounts = FALSE
  MaxClock = 1
  MaxCmds = 2
  MaxDevice = 0
  DeviceValues <- NoDevice
  InitialStored <- NothingStored
  Commands <- FewCommands
SPECIFICATION Spec
INVARIANTS TypeOK
