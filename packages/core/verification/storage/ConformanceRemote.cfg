\* A server that pushes every write to every tab, its savePartial calls landing in any order.
\* Walked move by move on the real Runs by conformance.test.ts.
CONSTANTS
  Adapter = "partial"
  Async = TRUE
  InOrder = FALSE
  TellsOwnWrites = TRUE
  HearCurrent = FALSE
  Failures = FALSE
  Unmounts = FALSE
  MaxClock = 1
  MaxCmds = 2
  MaxDevice = 0
  DeviceValues <- NoDevice
  InitialStored <- NothingStored
  Commands <- FewCommands
SPECIFICATION Spec
INVARIANTS TypeOK
