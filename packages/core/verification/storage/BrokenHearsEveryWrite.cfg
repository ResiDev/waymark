\* Breaks: a write that lands between the store reading a tab's load and the tab getting it is never heard.
\* bugs.test.ts: "a tab that opened while another tab saved never hears that save".
CONSTANTS
  Adapter = "partial"
  Async = TRUE
  InOrder = TRUE
  TellsOwnWrites = TRUE
  HearCurrent = FALSE
  Failures = FALSE
  Unmounts = FALSE
  MaxClock = 2
  MaxCmds = 4
  MaxDevice = 0
  DeviceValues <- NoDevice
  InitialStored <- NothingStored
  Commands <- AllCommands
SPECIFICATION Spec
INVARIANTS HearsEveryWrite
