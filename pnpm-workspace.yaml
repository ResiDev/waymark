packages:
  - 'packages/*'
  - 'apps/*'
  - 'e2e'

# esbuild ships a platform binary via a postinstall script; tsup/vitest need it.
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.1'
  - '@vitest/spy@5.0.1'
  - vitest@5.0.1
  - '@vitest/browser-playwright@5.0.1'
  - '@vitest/browser@5.0.1'
  - '@vitest/pretty-format@5.0.1'
  - '@vitest/ui@5.0.1'
  - '@vitest/utils@5.0.1'
